<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Softys & Melhoramentos Vertical Stack Lockup (One on top of the other for square format) -->
  
  <!-- TOP: Softys Official Mark -->
  <g transform="translate(200, 110)">
    <g transform="translate(-105, 0)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#005a9c" letter-spacing="-2">softys</text>
      <!-- Softys signature cyan dot -->
      <circle cx="218" cy="-38" r="9" fill="#00a3e0" />
    </g>
  </g>

  <!-- Subtle Horizontal Divider Line -->
  <line x1="60" y1="195" x2="340" y2="195" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" />

  <!-- BOTTOM: Melhoramentos Official Mark -->
  <g transform="translate(200, 280)">
    <!-- Centered group -->
    <g transform="translate(-145, 0)">
      <!-- Melhoramentos double chevron symbol -->
      <g transform="translate(0, -32)">
        <path d="M 0 0 L 26 0 L 21 11 L 26 22 L 0 22 L 5 11 Z" fill="#006837" />
        <path d="M 0 26 L 26 26 L 21 37 L 26 48 L 0 48 L 5 37 Z" fill="#006837" />
      </g>
      
      <!-- Melhoramentos Typography -->
      <text x="36" y="2" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#006837" letter-spacing="-0.5">Melhoramentos</text>
      
      <!-- Subtitle -->
      <text x="38" y="24" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="2">UMA EMPRESA CMPC</text>
    </g>
  </g>
</svg>
