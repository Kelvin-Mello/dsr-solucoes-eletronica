<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Softys & Melhoramentos Vertical Stack Lockup (Maximized Size & Optimized Internal Margin) -->
  
  <!-- TOP: Softys Official Mark -->
  <g transform="translate(200, 96)">
    <g transform="translate(-160, 0)">
      <text x="0" y="18" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#005a9c" letter-spacing="-2.5">softys</text>
      <!-- Softys signature cyan dot -->
      <circle cx="316" cy="-40" r="14" fill="#00a3e0" />
    </g>
  </g>

  <!-- Subtle Horizontal Divider Line -->
  <line x1="24" y1="188" x2="376" y2="188" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" />

  <!-- BOTTOM: Melhoramentos Official Mark -->
  <g transform="translate(200, 314)">
    <g transform="translate(-185, 0)">
      <!-- Melhoramentos double chevron symbol -->
      <g transform="translate(0, -44) scale(1.2)">
        <path d="M 0 0 L 30 0 L 24 13 L 30 26 L 0 26 L 6 13 Z" fill="#006837" />
        <path d="M 0 30 L 30 30 L 24 43 L 30 56 L 0 56 L 6 43 Z" fill="#006837" />
      </g>
      
      <!-- Melhoramentos Typography -->
      <text x="46" y="5" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#006837" letter-spacing="-0.5">Melhoramentos</text>
      
      <!-- Subtitle -->
      <text x="48" y="34" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13.5" fill="#64748b" letter-spacing="2.6">UMA EMPRESA CMPC</text>
    </g>
  </g>
</svg>
