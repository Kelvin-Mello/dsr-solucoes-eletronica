<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Hidrogeron Official Brand Vector -->
  <g transform="translate(45, 45)">
    <!-- Symbol: Water droplet and ring -->
    <g transform="translate(10, 5)">
      <!-- Outer ring gear/waves -->
      <circle cx="50" cy="50" r="48" fill="none" stroke="#0284c7" stroke-width="6" stroke-dasharray="24 10" />
      
      <!-- Inner water drop -->
      <path d="M 50 16 C 50 16 26 50 26 66 C 26 79 37 90 50 90 C 63 90 74 79 74 66 C 74 50 50 16 50 16 Z" fill="#0369a1" />
      
      <!-- Droplet highlight -->
      <path d="M 44 45 C 44 45 36 58 36 68 C 36 74 39 78 44 80 C 40 76 38 72 38 66 C 38 56 44 45 44 45 Z" fill="#38bdf8" opacity="0.8" />
    </g>

    <!-- Typography -->
    <g transform="translate(135, 20)">
      <!-- Wordmark HIDROGERON -->
      <text x="0" y="44" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="46" fill="#0f172a" letter-spacing="1">HIDROGERON</text>
      
      <!-- Subtitle -->
      <text x="2" y="70" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#0284c7" letter-spacing="2.2">TRATAMENTO DE ÁGUA E ESGOTO</text>
    </g>
  </g>
</svg>
